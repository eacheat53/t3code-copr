name: Update Specs & Build COPR

on:
  schedule:
    # Run daily at 01:15 UTC (09:15 UTC+8)
    - cron: "15 1 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate spec files from upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ./generate_spec.sh

      - name: Check for spec changes
        id: git-check
        run: |
          git status --porcelain
          if [[ -n "$(git status --porcelain t3code.spec t3code-nightly.spec)" ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated specs
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add t3code.spec t3code-nightly.spec
          VER_STABLE="$(awk '/^%global package_version / {print $3; exit}' t3code.spec)"
          VER_NIGHTLY="$(awk '/^%global package_version / {print $3; exit}' t3code-nightly.spec)"
          git commit -m "chore: update specs (stable ${VER_STABLE}, nightly ${VER_NIGHTLY})"
          git push

      - name: Install copr-cli
        if: steps.git-check.outputs.changes == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: pip install copr-cli

      - name: Write COPR config
        if: steps.git-check.outputs.changes == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          mkdir -p ~/.config
          printf '%s\n' "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Trigger COPR builds
        if: steps.git-check.outputs.changes == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          COPR_PROJECT="frugally7417/t3code"
          HEAD_SHA="$(git rev-parse HEAD)"
          VER_STABLE="$(awk '/^%global package_version / {print $3; exit}' t3code.spec)"
          VER_NIGHTLY="$(awk '/^%global package_version / {print $3; exit}' t3code-nightly.spec)"

          check_and_build() {
            local package_name="$1"
            local version="$2"
            local spec_file="$3"

            BUILT_VER="$(copr-cli get-package "$COPR_PROJECT" --name "$package_name" --with-latest-succeeded-build --output-format json 2>/dev/null | jq -r '.latest_succeeded_build.source_package.version // empty' | cut -d- -f1 || true)"

            if [[ "$BUILT_VER" == "$version" ]]; then
              echo "Package $package_name ($version) already has a successful build, skipping..."
            else
              echo "Triggering build for $package_name ($version, latest built: ${BUILT_VER:-none})..."
              copr-cli buildscm "$COPR_PROJECT" \
                --clone-url "${{ github.server_url }}/${{ github.repository }}" \
                --commit "$HEAD_SHA" \
                --spec "$spec_file" \
                --type git \
                --nowait
            fi
          }

          check_and_build "t3code" "$VER_STABLE" "t3code.spec"
          check_and_build "t3code-nightly" "$VER_NIGHTLY" "t3code-nightly.spec"
